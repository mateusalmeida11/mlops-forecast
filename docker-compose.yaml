services:
    jupyter-service:
      container_name: notebooks
      build:
        context: .
        dockerfile: ./notebooks/Dockerfile
      entrypoint: "scripts/docker-entrypoint.sh"
      user: root
      restart: always
      ports:
        - 8085:8085
      volumes:
        - "./notebooks:/home/src"
        - "./data:/home/src/data"
